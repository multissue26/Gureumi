<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="light">
  <title>내 등록 매물 | 띵팜</title>
  <link rel="stylesheet" href="admin-market.css?v=0.4.0">
  <link rel="icon" type="image/png" href="assets/brand/ddingfarm-logo.png">
  
</head>
<body>
  <main id="loginView" class="login">
    <p class="eyebrow">PRIVATE MARKET CONSOLE</p>
    <h2>관리자 확인</h2>
    <p>플리마켓 운영 데이터는 관리자만 볼 수 있어요. 기존 띵팜 관리자 비밀번호로 로그인해 주세요.</p>
    <form id="loginForm" class="login-form">
      <input id="pw" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" required>
      <button class="btn primary" type="submit">로그인</button>
    </form>
    <div id="loginMsg" class="login-msg"></div>
  </main>

  <main id="appView" class="shell hidden">
    <div class="brandbar">
      <a class="brand" href="admin-market.html">
        <img src="assets/brand/ddingfarm-logo.png" alt="띵팜">
        <span><strong>띵팜 플리마켓</strong><small>PRIVATE CONSOLE</small></span>
      </a>
      <div class="top-actions">
        <span class="status-note">Supabase 실데이터 연결</span>
        <button id="logoutBtn" class="btn">로그아웃</button>
      </div>
    </div>
    <nav class="navbar" aria-label="플리마켓 메뉴"><a href="admin-market.html" class="">홈</a><a href="admin-market-recommend.html" class="">음식 원재료 추천</a><a href="admin-market-crafting.html" class="">제작품 수익</a><a href="admin-market-listings.html" class="active">내 등록 매물</a><a href="admin-market-history.html" class="">가격 변동</a><a href="admin-market-sales.html" class="">판매 장부</a></nav>
    <header class="topbar"><div><p class="eyebrow">MY LISTINGS</p><h1>내 등록 매물</h1><p class="subtitle">실제로 캡처된 내 플리마켓 매물을 마지막 시장 스캔과 비교합니다.</p></div></header>
    
    <section class="panel table-wrap"><table>
      <thead><tr><th>상품</th><th>내 등록가 /64 환산</th><th>시장 최저가 /64</th><th>등록 수량</th><th>남은 수량</th><th>시장 대비</th></tr></thead>
      <tbody id="listingRows"></tbody>
    </table></section>
  </main>
  
  <script src="admin-market-core.js?v=0.4.0"></script>
  <script>
  async function render(){
    const F=MarketAdmin,t=document.querySelector("#listingRows");
    try{
      const [own,market]=await Promise.all([F.market("market-own-listings"),F.market("market-latest")]);
      const mm=new Map((market.items||[]).map(x=>[x.item_name,x]));
      const rows=own.listings||[];
      t.innerHTML=rows.length?rows.map(r=>{
        const own64=Number(r.listed_quantity)>0?Number(r.listing_price)/Number(r.listed_quantity)*64:null;
        const m=mm.get(r.item_name),low=m?.lowest_stack64_price;
        const gap=(Number.isFinite(own64)&&Number.isFinite(Number(low))&&Number(low)>0)?(own64-Number(low))/Number(low)*100:null;
        const cls=gap==null?"flat":Math.abs(gap)<=2?"up":gap>0?"down":"up";
        const label=gap==null?"비교 불가":Math.abs(gap)<=2?"경쟁 구간":gap>0?"시장보다 높음":"시장보다 낮음";
        return '<tr><td class="item-name">'+F.escapeHtml(r.item_name)+'</td><td class="price">'+F.gold(own64)+'</td><td class="price">'+(m?F.gold(low):"미확인")+'</td><td>'+F.fmt(r.listed_quantity)+'개</td><td>'+(r.remaining_quantity==null?"—":F.fmt(r.remaining_quantity)+"개")+'</td><td class="'+cls+'"><b>'+label+(gap==null?"":" · "+F.pct(gap))+'</b></td></tr>';
      }).join(""):'<tr><td colspan="6"><div class="empty-state"><strong>내 등록 매물 데이터 없음</strong><p>모드가 실제 내 매물 화면을 캡처해 업로드하면 이곳에 표시됩니다.</p></div></td></tr>';
    }catch(e){t.innerHTML='<tr><td colspan="6">'+F.errorState()+'</td></tr>'}
  }
  MarketAdmin.boot(render);
  </script>
</body>
</html>
